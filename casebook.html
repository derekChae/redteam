.cap .ci{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-text);white-space:nowrap}
.cap .ct{color:var(--ink2);min-width:0}
.cap .cd{color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.bleed{margin-top:clamp(28px,3vw,40px)}
.bleed .cap-wrap{max-width:var(--col);margin:0 auto;padding:0 var(--pad)}
/* 프로젝트 대표 영상·사진: 화면 끝까지 빠지지 않게 본문 폭(좌우 끝선) 안으로. 표지 대표 영상과 같은 둥근 모서리 */
@media screen{
  .proj .fig.bleed{max-width:var(--col);margin-left:auto;margin-right:auto;padding:0 var(--pad)}
  .proj .bleed .media{border-radius:12px;max-height:min(72vh,640px)}
  .proj .bleed .media>video,.proj .bleed .media>img{object-fit:contain}
  .proj .bleed .cap-wrap{max-width:none;padding:0}
  /* 아직 비어 있으면 큰 띠 대신 낮은 자리 표시만 */
  .proj .bleed .media:has(>.mph){aspect-ratio:auto;height:clamp(150px,16vw,220px)}
}
/* 표지 배치: 3:2 두 칸 축 하나로 소개와 경력표, 인용문과 담당업무, 대표 영상과 영상 소개를 맞춤.
   덩어리 사이(--gb)는 덩어리 안쪽 줄 간격보다 확실히 크게 */
.cover{--cg:clamp(24px,3vw,40px);--gb:clamp(28px,3.2vw,46px)}
@media screen{.cover{padding:clamp(32px,4vw,60px) 0 0}}
.cover .top{padding-bottom:14px;margin-bottom:var(--gb)}
.cover .lead{margin-bottom:clamp(2px,.5vw,8px)}
.cover h1{font-size:clamp(40px,6vw,86px);line-height:1.08}
.cover .wrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);column-gap:var(--cg)}
.cover .top{grid-column:1/-1;grid-row:1}
.cover .lead{grid-column:1/-1;grid-row:2}
.cover h1{grid-column:1/-1;grid-row:3}
.cover .sub{grid-column:1;grid-row:4;margin-top:var(--gb)}
.cover .low{display:contents}
.cover .who{grid-column:2;grid-row:4;align-self:start;margin-top:var(--gb)}
.cover .tg{grid-column:1/-1;grid-row:5;margin-top:var(--gb);display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);column-gap:var(--cg);align-items:start}
.cover .tg .tq,.cover .tg .tj{display:block;min-width:0}
.cover .tg{font-size:17px}
.cover .tg .tj{font-size:15.5px;line-height:1.75}
body.editing .cover .tg{display:block}
#reel{max-width:var(--col);margin:clamp(40px,4.6vw,66px) auto 0;padding:0 var(--pad) clamp(28px,3vw,44px)}
#reel .reelfig{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);column-gap:var(--cg);align-items:stretch}
#reel .reelfig>.media{align-self:start}
#reel .reelfig.solo{display:block}
#reel .media{border-radius:12px}
#reel .media>video,#reel .media>img{object-fit:contain}
/* 영상 소개: 영상과 같은 높이로 늘려 윗선(굵은 선)과 아랫선을 영상 위아래에 맞추고, 항목은 남는 높이에 고르게 */
.rcap{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr;column-gap:12px;font-size:14px;line-height:1.5;color:var(--ink2);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding-top:9px}
.rcap .ct:not(.rc-raw){display:contents}
.rc-meta{grid-row:1;grid-column:2;display:flex;gap:8px;align-items:baseline;font-size:12.5px;line-height:1.5;padding-top:1px}
.rc-meta .ci{font-weight:700;color:var(--accent-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-meta .cd{color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-ttl{grid-row:1;grid-column:1;font-size:14.5px;line-height:1.5;color:var(--ink)}
.rc-list,.rc-raw,.rcap .ct>.rc-body{grid-row:2;grid-column:1/-1}
.rc-list{list-style:none;margin-top:6px;display:flex;flex-direction:column;justify-content:space-between}
.rc-list li{display:block;padding:6px 0 5px;border-top:1px solid var(--line)}
.rc-it{display:block;font-weight:700;color:var(--ink);font-size:14.5px;line-height:1.45;margin-bottom:2px}
.rc-n{display:inline-block;min-width:1.4em;color:var(--accent-text);font-variant-numeric:tabular-nums}
.rc-d{display:block;position:relative;padding-left:1.6em}
.rc-d+.rc-d{margin-top:3px}
.rc-d::before{content:"";position:absolute;left:.45em;top:.75em;width:.5em;height:1px;background:var(--ink3)}
.rc-raw{margin-top:8px;padding-bottom:8px}
/* 글이 영상보다 길어지는 폭에서는 영상 아래로 내림(화면 그리기 코드가 판단) */
#reel .reelfig.rf-stack{grid-template-columns:minmax(0,1fr)}
#reel .reelfig.rf-stack .rcap{margin-top:16px}
#reel .reelfig.rf-stack .rc-list{justify-content:flex-start}
@media screen and (max-width:960px){
  .cover{--gb:clamp(26px,6vw,36px)}
  .cover .wrap{grid-template-columns:minmax(0,1fr)}
  .cover .top,.cover .lead,.cover h1,.cover .sub,.cover .who,.cover .tg{grid-column:1;grid-row:auto}
  .cover .tg{grid-template-columns:minmax(0,1fr);row-gap:22px;font-size:16px}
  .cover .tg .tj{font-size:16px}
  .cover .who{margin-top:var(--gb);align-self:auto}
  #reel .reelfig{grid-template-columns:minmax(0,1fr)}
  .rcap{margin-top:16px}
  .rc-list{justify-content:flex-start}
}

/* 대표 영상 4칸 (2x2, 960px 이하 1열). 각 칸 아래 번호, 제목, 재생시간, 설명 */
#reel .rl-grid{display:grid;grid-template-columns:repeat(var(--rn,2),minmax(0,1fr));gap:clamp(28px,3vw,40px) var(--cg)}
#reel .rl-tile{min-width:0}
#reel .rl-tile .media{border:1px solid var(--line)}
.rl-cap{padding-top:12px;border-top:0}
.rl-h{display:flex;align-items:baseline;gap:10px;min-width:0}
.rl-n{flex:none;font-size:12.5px;font-weight:700;color:var(--accent-text);font-variant-numeric:tabular-nums}
.rl-t{min-width:0;font-size:16.5px;font-weight:700;color:var(--ink);letter-spacing:-0.02em;line-height:1.4}
.rl-h .cd{flex:none;margin-left:auto;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.rl-d{margin-top:4px;font-size:14px;line-height:1.6;color:var(--ink2)}
body:not(.editing) .rl-d:empty{display:none}
body.editing #reel .rl-old{display:block!important;margin-top:28px;padding-top:12px;border-top:1px dashed var(--line)}
.rl-old .lbl{display:block;margin-bottom:6px}
.rl-old-t{font-size:14px;line-height:1.6;color:var(--ink2)}
@media screen and (max-width:960px){
  #reel .rl-grid{grid-template-columns:minmax(0,1fr);row-gap:28px}
}

/* 읽는 법 + 목차 */
.guide{padding:clamp(56px,7vw,96px) 0;border-bottom:1px solid var(--line)}
@media screen{.guide{padding-top:clamp(40px,4.4vw,60px)}}
.guide .gh{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.guide h2{font-size:clamp(26px,2.6vw,34px);letter-spacing:-0.035em;line-height:1.25}
.conf{display:flex;gap:12px;align-items:baseline;margin-top:20px;padding:12px 16px;background:var(--tint);border-left:3px solid var(--accent);font-size:14px;line-height:1.65;color:var(--ink2)}
.conf[hidden]{display:none}
.conf b{flex:none;font-size:12.5px;font-weight:700;color:var(--accent-text);letter-spacing:-0.01em}
.guide .conf{margin-top:18px}
@media screen and (max-width:620px){.conf{flex-direction:column;gap:4px}}
.guide .cnt{font-size:15px;color:var(--ink3);font-variant-numeric:tabular-nums}
body:not(.editing) .sec>header p:empty{display:none}
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:clamp(32px,4vw,56px)}
.toc a{text-decoration:none;border:1px solid var(--line);padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .25s cubic-bezier(.2,.7,.2,1)}
.toc a:hover{border-color:var(--ink);transform:translateY(-2px)}
.toc .no{font-size:40px;font-weight:200;line-height:1;color:var(--accent);letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.toc .t{font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.35}
.toc .o{font-size:14px;color:var(--ink2);line-height:1.55}

/* 프로젝트 장 */
.proj{border-bottom:1px solid var(--ink)}
.opener{padding:clamp(72px,10vw,140px) 0 0}
.opener .hd{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,3vw,48px);align-items:end}
.opener .big{font-size:clamp(88px,13vw,190px);font-weight:200;line-height:.82;letter-spacing:-0.06em;color:var(--accent);font-variant-numeric:tabular-nums}
.opener h2{font-size:clamp(32px,4.4vw,60px);letter-spacing:-0.045em;line-height:1.12;font-weight:800}
.opener .ol{font-size:clamp(17px,1.5vw,20px);color:var(--body);margin-top:12px;max-width:36em}
.meta{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin-top:clamp(32px,4vw,52px)}
.meta>div{padding:14px 14px 16px 0;font-size:15px;line-height:1.5;min-width:0}
.meta>div+div{padding-left:14px;border-left:1px solid var(--line)}
.meta .lbl{display:block;margin-bottom:4px}
.meta .stack{display:flex;flex-wrap:wrap;gap:4px}
.meta .stack>span:not(.ed-ctl){font-size:13px;border:1px solid var(--line);border-radius:999px;padding:0 8px}

.sec{display:grid;grid-template-columns:240px 1fr;gap:clamp(24px,4vw,64px);padding:clamp(48px,6vw,80px) 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec>header{position:sticky;top:80px;align-self:start}
/* 프로젝트 목차 (왼쪽 고정) */
.pbody{display:block;position:relative}
.ptoc{position:fixed;left:max(12px,calc((100vw - var(--col))/2 - 220px));top:120px;width:180px;z-index:50;max-height:calc(100vh - 140px);overflow-y:auto;overscroll-behavior:contain}
.pt-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-bottom:16px;padding-bottom:10px}
.pt-hd .pt-no{font-weight:700;color:var(--accent-text);letter-spacing:.02em}
.pt-hd b{color:var(--ink);font-weight:700}
.pt-bar{height:2px;background:var(--line);margin:10px 0 8px;position:relative}
.pt-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);transition:width .25s}
.ptoc ol{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.ptoc button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:34px 1fr;gap:6px;width:100%;padding:7px 8px;border-radius:6px;font-size:14px;line-height:1.4;color:var(--ink2);cursor:pointer}
.ptoc button .n{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:1px}
.ptoc button:hover{background:var(--tint);color:var(--ink)}
.ptoc button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ptoc button.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.ptoc button.on .n{color:var(--accent-text)}
.psecs .sec{grid-template-columns:1fr;gap:0}
.psecs .sec>header{position:static;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px;margin-bottom:clamp(20px,2.4vw,32px)}
.psecs .sec>header .n{order:0}
.psecs .sec>header h3{margin-top:0}
.psecs .sec>header p{flex-basis:100%;margin-top:6px}
@media screen and (max-width:900px){
  .pbody{display:block}
  .ptoc{position:sticky;top:57px;left:auto;width:auto;z-index:15;background:#fff;padding:8px 0;margin:0 calc(-1 * var(--pad));padding-left:var(--pad);padding-right:var(--pad);border-bottom:1px solid var(--line)}
  .pt-hd{display:none}
  .pt-bar{display:none}
  .ptoc ol{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 24px),transparent);padding:0 20px 0 12px;margin:0 -12px}
  .ptoc ol::-webkit-scrollbar{display:none}
  .ptoc button{display:flex;gap:6px;width:auto;white-space:nowrap;padding:6px 10px;font-size:13px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media print{.bar,.ptoc,.appx-nav,.fold-chevron{display:none!important}.wrap{max-width:none;padding:0}.cover .wrap{grid-template-columns:1fr}.ps-col,.tech-card,.learning-item{break-inside:avoid}.pbody{display:block}video{display:none}}
/* 모바일 햄버거 메뉴 */
.mbtn,.mnav,.mshade{display:none}
@media screen and (max-width:900px){
  .bar nav#barNav{display:none}
  .ptoc{display:none}
  .mbtn{display:inline-flex;flex-direction:column;justify-content:center;gap:5px;margin-left:auto;width:42px;height:42px;padding:0 10px;border:0;background:none;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .mbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .mbtn span{display:block;height:2px;background:var(--ink);border-radius:2px;transition:transform .2s,opacity .2s}
  .mbtn[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .mbtn[aria-expanded="true"] span:nth-child(2){opacity:0}
  .mbtn[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .mshade:not([hidden]){display:block;position:fixed;left:0;right:0;bottom:0;top:57px;background:rgba(27,25,22,.28);z-index:1}
  .mnav:not([hidden]){display:block;position:absolute;left:0;right:0;top:100%;z-index:2;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 18px 30px -18px rgba(0,0,0,.28);max-height:calc(100vh - 57px);max-height:calc(100dvh - 57px);overflow:auto;overscroll-behavior:contain;padding:10px var(--pad) 22px}
  .mnav a,.mnav button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:baseline;width:100%;padding:12px 12px;border-radius:8px;font-size:16px;line-height:1.4;color:var(--ink);cursor:pointer}
  .mnav a:hover,.mnav button:hover{background:var(--tint)}
  .mnav a:focus-visible,.mnav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .mnav .on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
  .mnav h4{font-size:12.5px;font-weight:600;color:var(--ink3);margin:16px 12px 6px;padding-top:14px;border-top:1px solid var(--line)}
  .mnav .mtoc button{font-size:15px;color:var(--ink2)}
  .mnav .mtoc .n{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:34px}
  .mnav .mtoc .on{color:var(--accent-text)}
  .mnav .mtoc .on .n{color:var(--accent-text)}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media print{.mbtn,.mnav,.mshade{display:none!important}}
.sec>header .n{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.sec>header h3{font-size:24px;letter-spacing:-0.03em;line-height:1.3;margin-top:4px}

.dec{margin-bottom:40px}

<script id="casebook-render">
/* 화면 그리기. 데이터(window.CASEBOOK)만 읽습니다. */
const CB = {
  D: window.CASEBOOK,
  editing: false,
  get(p) { return p.split('.').reduce((o, k) => (o == null ? o : o[k]), CB.D); },
  set(p, v) { const ks = p.split('.'); let o = CB.D; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks.at(-1)] = v; },
};
(function () {
  // 다른 사이트가 이 페이지를 프레임으로 감싸면(클릭재킹) 아무것도 그리지 않음
  try { if (window.top !== window.self && window.top.location.origin !== window.location.origin) throw 0; }
  catch (e) { document.documentElement.innerHTML = ''; return; }
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const isSlot = s => /\[\[.+?\]\]/.test(String(s || ''));
  const plain = s => String(s || '').replace(/\*\*(.+?)\*\*/gs, '$1').replace(/\[\[(.+?)\]\]/g, '$1').replace(/\[([^\[\]]+)\]\((?:https?:\/\/|mailto:)[^\s)]+\)/g, '$1');
  const pad = n => String(n).padStart(2, '0');
  // 글자 속 링크: [보일 글자](https://주소)
  const LINK = /\[([^\[\]]+)\]\(((?:https:\/\/|mailto:)[^\s)"'<>]+)\)/g;
  const f = s => s == null ? '' : esc(s)
    .replace(LINK, (m, t, u) => `<a class="lk" href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`)
    .replace(/\[\[(.+?)\]\]/g, (m, x) => `<span class="slot" data-orig="${x}">${x}</span>`)
    .replace(/\*\*(.+?)\*\*/gs, '<em class="hl">$1</em>')
    .replace(/\n/g, '<br>');
  CB.f = f; CB.plain = plain; CB.isSlot = isSlot;
  const T = (p, tag = 'span', cls = '') => `<${tag}${cls ? ` class="${cls}"` : ''}${CB.editing ? ` data-k="${p}"` : ''}>${f(CB.get(p))}</${tag}>`;
  const okURL = u => /^(https:\/\/[^\s"'<>]+|mailto:[^\s"'<>@]+@[^\s"'<>]+)$/i.test(String(u || ''));
  // 링크 묶음: [{label, url}] 을 버튼처럼. 편집 모드에서는 이름 고치기 + 주소 버튼
  function LKS(p, cls = '') {
    const a = CB.get(p) || [];
    if (!CB.editing) {
      const items = a.filter(l => l && (okURL(l.url) || okURL(String(l.label || '').trim()) || isSlot(l.url) || isSlot(l.label))).map(l => {
        const lb = String(l.label || '').trim();
        if (okURL(l.url)) return { label: lb && !okURL(lb) ? l.label : '링크 보기', url: l.url };
        if (okURL(lb)) return { label: '링크 보기', url: lb };
        return l;
      });
      if (!items.length) return '';
      return `<div class="lks ${cls}">${items.map(l => okURL(l.url)
        ? `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${f(l.label)}<i>↗</i></a>`
        : `<span class="lkp">${f(l.label)} ${f(l.url)}</span>`).join('')}</div>`;
    }
    return `<div class="lks ${cls}">${a.map((l, i) => `<span class="lkp ed">${T(`${p}.${i}.label`)}<button class="ed-only" data-url="${p}.${i}.url" title="${esc(l.url || '')}">${okURL(l.url) ? '주소 ✓' : '주소 넣기'}</button><button class="ed-only" data-del="${p}|${i}">×</button></span>`).join('')}<button class="ed-only ed-lk" data-add="${p}">+ 링크</button></div>`;
  }
  CB.okURL = okURL;
  const ED = (html) => CB.editing ? `<span class="ed-only ed-ctl">${html}</span>` : '';
  const addBtn = (p, label) => CB.editing ? `<button class="ed-only ed-add" data-add="${p}">+ ${label} 추가</button>` : '';
  const delBtn = (p, i) => ED(`<button data-del="${p}|${i}" title="삭제">삭제</button>`);
  const ARROW = '<div class="arrow"><svg viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 7h22M17 1l6 6-6 6"/></svg></div>';

  // 영상·사진 주소는 https, 같은 폴더의 media/ 파일, 사진·영상 data:, 풀린 blob: 만 허용
  function safeMedia(s) {
    s = String(s || '').trim(); if (!s) return null;
    if (/^https:\/\/[^\s"'<>]+$/i.test(s)) return s;
    if (/^blob:[^\s"'<>]+$/i.test(s)) return s;
    if (/^data:(image\/(png|jpe?g|gif|webp|avif)|video\/(mp4|webm|quicktime));base64,[A-Za-z0-9+\/=]+$/i.test(s)) return s;
    if (/^(\.\/)?media\/[^\s"'<>:\\?#]+$/i.test(s) && !/(^|\/)\.\.(\/|$)/.test(s)) return s;
    return null;
  }
  CB.safeMedia = safeMedia;
  function kindOf(src) {
    if (!src) return null;
    if (/^data:video\//.test(src)) return 'video';
    if (/^data:image\//.test(src)) return 'image';
    if (/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be|youtube-nocookie\.com)\//i.test(src)) return 'youtube';
    if (/^https:\/\/(www\.|player\.)?vimeo\.com\//i.test(src)) return 'vimeo';
    if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(src)) return 'video';
    return 'image';
  }
  function ytId(src) { return (String(src).match(/(?:[?&]v=|youtu\.be\/|\/embed\/|\/shorts\/|\/live\/)([\w-]{6,})/) || [])[1] || null; }
  // 넣을 수 있는 영상·사진 주소인지: 유튜브·비메오 영상, 사진·영상 파일 주소, media 폴더 파일
  function mediaOK(src) {
    const s = safeMedia(src); if (!s) return { ok: false, why: 'https:// 로 시작하는 주소나 media 폴더 안 파일만 넣을 수 있어요.' };
    const k = kindOf(s);
    if (k === 'youtube') return ytId(s) ? { ok: true } : { ok: false, why: '유튜브 영상 한 편의 주소가 아니에요. 재생목록이나 채널 주소 말고, 영상 하나를 열었을 때의 주소(공유 버튼 주소)를 넣어 주세요.' };
    if (k === 'vimeo') return /vimeo\.com\/(?:video\/)?\d+/.test(s) ? { ok: true } : { ok: false, why: '비메오 영상 한 편의 주소를 넣어 주세요.' };
    if (/^https:/i.test(s) && !/\.(jpe?g|png|gif|webp|avif|mp4|webm|mov|m4v)(\?|#|$)/i.test(s)) return { ok: false, why: '이 주소는 영상·사진 파일이 아니라 웹 페이지라서 여기서 재생할 수 없어요.\n\n되는 것: 유튜브·비메오 영상 주소, 또는 영상 파일을 받아서 [파일 넣기]\n안 되는 것: 네이버TV, 구글 드라이브, 인스타그램 같은 페이지 주소' };
    return { ok: true };
  }
  CB.mediaOK = mediaOK;
  function embed(src, k) {
    if (k === 'youtube') {
      const id = ytId(src);
      if (!id) return 'about:blank';
      return `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&rel=0&playsinline=1&modestbranding=1`;
    }
    const id = (src.match(/vimeo\.com\/(?:video\/)?(\d+)/) || [])[1];
    if (!id) return 'about:blank';
    return `https://player.vimeo.com/video/${id}?background=1`;
  }
  // 영상·사진 칸 하나 + 캡션 줄
  /* 대외 이력 사진·영상: 보기 화면에서는 접어 두고 버튼으로 펼침 */
  const AM = {};
  const amHas = it => Array.isArray(it.media) && (CB.editing ? it.media.length > 0 : it.media.some(m => safeMedia(m && m.src)));
  function amLabel(it) {
    const ks = it.media.filter(m => safeMedia(m && m.src)).map(m => kindOf(safeMedia(m.src)) === 'image' ? 'p' : 'v');
    const name = ks.every(x => x === 'p') ? '사진' : ks.every(x => x === 'v') ? '영상' : '사진·영상';
    return `${name} 보기${ks.length > 1 ? ` <span class="n">${ks.length}</span>` : ''}`;
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('.amtg'); if (!b || CB.editing) return;
    const key = b.dataset.am, row = document.querySelector(`[data-am-row="${key}"]`); if (!row) return;
    const open = row.hidden; row.hidden = !open; b.setAttribute('aria-expanded', open ? 'true' : 'false');
    const th = document.querySelector(`#activities th[data-amg="${key.split('-')[0]}"]`); if (th) th.rowSpan += open ? 1 : -1;
    row.querySelector('.amed').innerHTML = open ? (AM[key] || '') : '';
    b.classList.toggle('on', open);
    if (open) setupVideos();
  // 왼쪽 네비 스크롤 처리 + 현재 섹션 하이라이트
  document.addEventListener('click', e => {
      const btn = e.target.closest('[data-scroll]');
      if (!btn) return;
      e.preventDefault();
      const el = document.getElementById(btn.dataset.scroll);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        btn.closest('.appx-nav').querySelectorAll('.an-item').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
      }
    });
    // 스크롤 시 하이라이트 갱신
    let anTick = 0;
    window.addEventListener('scroll', () => {
      clearTimeout(anTick);
      anTick = setTimeout(() => {
        document.querySelectorAll('.appx-nav').forEach(nav => {
          if (nav.offsetParent === null) return;
          const items = [...nav.querySelectorAll('.an-item')];
          let active = items[0];
          for (const item of items) {
            const el = document.getElementById(item.dataset.scroll);
            if (el && el.getBoundingClientRect().top <= 200) active = item;
          }
          items.forEach(b => b.classList.toggle('on', b === active));
          const bar = nav.querySelector('.an-bar i');
          if (bar) { const idx = items.indexOf(active); bar.style.width = ((idx + 1) / items.length * 100) + '%'; }
        });
      }, 80);
    }, { passive: true });
    setupVideos();
    addEventListener('beforeprint',()=>document.querySelectorAll('details.sec-fold').forEach(d=>d.open=true));
  });
  function M(p, idx, { ratio = '16/9', hint = '대표 영상 또는 사진', bleed = false } = {}) {
    const m = CB.get(p) || {}, raw = safeMedia(m.src), k = kindOf(raw);
    const MAP = window.__CB_MEDIA || {};
    const src = raw && (MAP[raw] || raw), poster = safeMedia(m.poster) && (MAP[m.poster] || m.poster);
    let inner;
    if (!src) inner = `<div class="mph"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><span class="rt">${ratio.replace('/', ':')}</span>
      <div><b>${hint}</b>영상(mp4) 또는 사진(jpg·png)</div></div>`;
    else if (k === 'video') inner = `<video src="${esc(src)}"${poster ? ` poster="${esc(poster)}"` : ''} muted loop playsinline preload="metadata"></video>
      <div class="vc"><button data-v="play">일시정지</button><button data-v="mute">소리 켜기</button></div>`;
    else if (k === 'youtube' || k === 'vimeo') inner = `<iframe src="${embed(src, k)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin" sandbox="allow-scripts allow-same-origin allow-presentation" title="${esc(plain(m.caption))}"></iframe>`;
    else inner = `<img src="${esc(src)}" alt="${esc(plain(m.caption))}" loading="lazy">`;
    const label = !src ? idx : (k === 'image' ? '사진 ' : '영상 ') + idx;
    const media = `<div class="media" style="--r:${ratio}"${CB.editing ? ` data-media="${p}"` : ''}>${inner}
      ${CB.editing ? `<div class="ed-only medctl"><button data-mpick="${p}">파일 넣기</button><button data-murl="${p}">주소 넣기</button>${m.src ? `<button data-mclear="${p}">빼기</button>` : ''}</div>` : ''}</div>`;
    const cap = `<div class="cap"><span class="ci">${label}</span>${T(p + '.caption', 'span', 'ct')}<span class="cd">${k === 'image' ? '' : ''}</span></div>`;
    return bleed ? `<figure class="fig bleed">${media}<div class="cap-wrap">${cap}</div></figure>` : `<figure class="fig">${media}${cap}</figure>`;
  }

  /* 표지 인용문: 빈 줄로 나뉜 덩어리를 따로 묶어 데스크톱에서 나란히 놓음 (글자는 그대로) */
  function TAG(raw) {
    const parts = String(raw ?? '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
    if (parts.length < 2) return f(raw);
    return `<span class="tq">${f(parts[0])}</span><span class="tj">${f(parts.slice(1).join('\n\n'))}</span>`;
  }
  /* 대표 영상 + 영상 소개: 데스크톱은 영상 옆 세로 목록, 좁은 화면은 영상 아래 목록.
     보기 화면에서만 "1. 제목" 줄과 "=> 설명" 줄을 묶어 보여 주고, 편집 모드는 원래 글 그대로 고침 */
  function reelList(raw) {
    const lines = String(raw ?? '').split('\n'), head = [], items = [];
    for (const ln of lines) {
      const t = ln.trim(); if (!t) continue;
      const mNum = t.match(/^(\d+)\.\s*(.*)$/), mArr = t.match(/^=>\s*(.*)$/);
      if (mNum) items.push({ n: mNum[1], t: mNum[2], d: [] });
      else if (items.length) items.at(-1).d.push(mArr ? mArr[1] : t);
      else head.push(mArr ? mArr[1] : t);
    }
    if (!items.length) return `<div class="rc-body">${f(raw)}</div>`;
    return (head.length ? `<div class="rc-ttl">${head.map(f).join('<br>')}</div>` : '')
      + `<ol class="rc-list">${items.map(it => `<li><b class="rc-it"><span class="rc-n">${esc(it.n)}.</span>${f(it.t)}</b>${it.d.map(d => `<span class="rc-d">${f(d)}</span>`).join('')}</li>`).join('')}</ol>`;
  }
  /* 대표 영상 4칸: 영상마다 번호·제목·설명을 바로 붙임. 옛 영상 소개(owner.reel.caption)는 편집 모드에서만 보임 */
  function REELS(p) {
    const a = CB.get(p) || [];
    const tiles = a.map((r, i) => {
      const q = `${p}.${i}`, no = pad(i + 1);
      const fig = M(q, no, { hint: '대표 영상' });
      const media = fig.slice('<figure class="fig">'.length, fig.lastIndexOf('<div class="cap">'));
      return `<figure class="fig rl-tile">${media}<figcaption class="rl-cap"><div class="rl-h"><span class="rl-n">${no}</span>${T(q + '.title', 'b', 'rl-t')}<span class="cd"></span></div>${T(q + '.desc', 'p', 'rl-d')}</figcaption></figure>`;
    }).join('');
    const old = CB.editing ? `<div class="ed-only rl-old"><span class="lbl">예전 영상 소개 (보기 화면에는 보이지 않음)</span>${T('owner.reel.caption', 'div', 'rl-old-t')}</div>` : '';
    /* 열 수: 1개 1열, 2개 2열, 3개 3열, 4개 2x2, 5개 이상 3열 */
    const n = a.length, cols = n === 4 ? 2 : Math.max(1, Math.min(n, 3));
    return `<div class="rl-grid" style="--rn:${cols}">${tiles}</div>${old}`;
  }
  function REEL(p) {
    const m = CB.get(p) || {}, cap = String(m.caption ?? '').trim();
    const fig = M(p, '00', { hint: '대표 영상' });
    if (!cap && !CB.editing) return fig.replace('<figure class="fig">', '<figure class="fig reelfig solo">');
    const media = fig.slice(0, fig.lastIndexOf('<div class="cap">')).replace('<figure class="fig">', '<figure class="fig reelfig">');
    const raw = safeMedia(m.src), k = kindOf(raw);
    const label = !raw ? '00' : (k === 'image' ? '사진 ' : '영상 ') + '00';
    const body = CB.editing ? T(p + '.caption', 'div', 'ct rc-raw') : `<div class="ct">${reelList(cap)}</div>`;
    return `${media}<figcaption class="rcap"><div class="rc-meta"><span class="ci">${label}</span><span class="cd"></span></div>${body}</figcaption></figure>`;
  }

  /* 대표 영상 옆 영상 소개가 영상보다 길면 영상 아래로 내림 (넘침, 겹침 방지) */
  function fitReel() {
    const fig = document.querySelector('#reel .reelfig:not(.solo)'); if (!fig) return;
    const m = fig.querySelector('.media'), c = fig.querySelector('.rcap'); if (!m || !c) return;
    fig.classList.remove('rf-stack');
    if (window.innerWidth <= 960) return;
    c.style.alignSelf = 'start';
    const need = c.getBoundingClientRect().height, have = m.getBoundingClientRect().height;
    c.style.alignSelf = '';
    if (need > have + 1) fig.classList.add('rf-stack');
  }
  CB.fitReel = fitReel;
  let fitT = 0;
  window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitReel, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitReel());
  function secBody(key, p, i) {
    const P = `projects.${i}`, d = CB.get(P);
    if (key === 'background') return `<div class="bg3"><div><h4>문제</h4>${T(P + '.background.problem', 'p')}</div><div><h4>목표</h4>${T(P + '.background.goal', 'p')}</div><div><h4>성공 기준</h4>${T(P + '.background.criteria', 'p')}</div></div>`;
    if (key === 'approach') {
      const ap = d.approach || {};
      return `<div class="appr">${(ap.points || []).map((pt, j) => {
        const q = `${P}.approach.points.${j}`;
        return `<div class="apr"><div class="apr-q"><i>판단 ${j + 1}</i>${T(q + '.point')}${delBtn(P + '.approach.points', j)}</div><div class="why"><b>근거</b>${T(q + '.reason')}</div></div>`;
      }).join('')}${addBtn(P + '.approach.points', '판단')}</div>
        <div class="arch-fig">${M(P + '.approach.media', `${pad(i + 1)}.2`, { hint: '공격 경로도 또는 구성도', ratio: '16/9' })}</div>
        <ul class="notes">${(ap.notes || []).map((n, j) => `<li>${T(`${P}.approach.notes.${j}`)}${delBtn(P + '.approach.notes', j)}</li>`).join('')}</ul>${addBtn(P + '.approach.notes', '강조점')}`;
    }
    if (key === 'constraints') {
      const cTitle = p.sectionTitles?.[2] || D.copy.sections[2].title;
      const cCount = (d.constraints || []).length;
      return `<details class="sec-fold"><summary class="sec-fold-head"><span class="fold-num">${pad(i+1)}.3</span><span class="fold-title">${esc(plain(cTitle))}</span><span class="fold-bar" aria-hidden="true"></span><span class="fold-count">${cCount}개</span><span class="fold-chevron" aria-hidden="true">▾</span></summary><div class="fold-body"><div class="csts">${(d.constraints || []).map((c, j) => {
        const q = `${P}.constraints.${j}`;
        return `<div class="cst"><div class="cst-h">${T(q + '.label', 'b')}${delBtn(P + '.constraints', j)}</div><div class="cst-a">${T(q + '.action', 'p')}</div></div>`;
      }).join('')}${addBtn(P + '.constraints', '제약')}</div></div></details>`;
    }
    if (key === 'outcome') {
      const sTitle = p.sectionTitles?.[3] || D.copy.sections[3].title;
      const techCount = d.outcome.metrics.length;
      const isTextOnly = d.gallery.length > 0 && d.gallery.every(g => !g.src && g.caption && !isSlot(g.caption));
      return `<details class="sec-fold" open><summary class="sec-fold-head"><span class="fold-num">${pad(i+1)}.4</span><span class="fold-title">${esc(plain(sTitle))}</span><span class="fold-bar" aria-hidden="true"></span><span class="fold-count">${techCount}개</span><span class="fold-chevron" aria-hidden="true">▾</span></summary><div class="fold-body"><div class="techs">${d.outcome.metrics.map((m, j) => `<div class="tech-card">${T(`${P}.outcome.metrics.${j}.value`, 'div', 'tech-name')}${T(`${P}.outcome.metrics.${j}.label`, 'div', 'tech-desc')}</div>`).join('')}${addBtn(P + '.outcome.metrics', '기법')}</div>
      <div class="why" style="margin-top:22px"><b>후속 조치</b>${T(P + '.outcome.followup')}</div></div></details>`;
    }
    if (key === 'gallery') {
      const isTextOnly = d.gallery.length > 0 && d.gallery.every(g => !g.src && g.caption && !isSlot(g.caption));
      if (isTextOnly && !CB.editing) return `<div class="learnings">${d.gallery.map((g, j) => `<div class="learning-item"><span class="learning-no">${String(j+1).padStart(2,'0')}</span><p>${esc(plain(g.caption))}</p></div>`).join('')}</div>`;
      return `<div class="gal">${d.gallery.map((g, j) => `<div class="fig">${M(`${P}.gallery.${j}`, `${pad(i + 1)}.${j + 1}`, { ratio: j === 0 ? '16/9' : '4/3', hint: j === 0 ? '메인 결과물' : '세부 화면' })}${delBtn(P + '.gallery', j)}</div>`).join('')}</div>${addBtn(P + '.gallery', '영상·사진')}`;
    }
    return '';
  }
  const KEYS = ['background', 'approach', 'constraints', 'outcome', 'gallery'];

  const projName = (p, i) => isSlot(p.title) ? '프로젝트 ' + (i + 1) : esc(plain(p.title));
  function pager(i) {
    const P = CB.D.projects, prev = P[i - 1], next = P[i + 1];
    return `<nav class="pager" aria-label="프로젝트 이동">${prev ? `<a class="pv" href="#p${i}">← 이전 프로젝트<b>${pad(i)} ${projName(prev, i - 1)}</b></a>` : '<span></span>'}<a class="hm" href="#home">목록으로</a>${next ? `<a class="nx" href="#p${i + 2}">다음 프로젝트 →<b>${pad(i + 2)} ${projName(next, i + 1)}</b></a>` : '<span></span>'}</nav>`;
  }
  CB.render = function () {
    const D = CB.D, C = D.copy;
    document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || D.theme || 'orange';
    document.documentElement.dataset.slot = new URLSearchParams(location.search).get('slot') === 'navy' ? 'navy' : (D.slotColor === 'navy' ? 'navy' : 'orange');
    $('barName').innerHTML = `<a href="#home">${f(D.owner.name)}</a>`;
    $('barNav').innerHTML = D.projects.map((p, i) => `<a href="#p${i + 1}" data-p="p${i + 1}">${pad(i + 1)} ${isSlot(p.title) ? '프로젝트 ' + (i + 1) : esc(plain(p.title))}</a>`).join('')
      + (D.others?.length ? `<a href="#others" data-p="others">${esc(plain(C.othersTitle))}</a>` : '')
      + (D.activities?.length ? `<a href="#activities" data-p="activities">${esc(plain(C.actsTitle))}</a>` : '')
      + (D.side?.show ? `<a href="#side" data-p="side">${esc(plain(C.sideTitle))}</a>` : '');
    document.title = isSlot(D.owner.name) ? '포트폴리오' : plain(D.owner.name);
    $('coverTop').innerHTML = `<span>${T('owner.name', 'b')}${T('owner.role')}</span>`;
    $('coverLead').innerHTML = f(D.owner.lead ?? ''); $('coverTitle').innerHTML = f(D.owner.headline ?? ''); $('coverSub').innerHTML = f(D.owner.sub ?? ''); $('tagline').innerHTML = CB.editing ? f(D.owner.tagline) : TAG(D.owner.tagline);
    for (const [id, k] of [['coverLead', 'owner.lead'], ['coverTitle', 'owner.headline'], ['coverSub', 'owner.sub'], ['tagline', 'owner.tagline']]) { if (CB.editing) $(id).dataset.k = k; else { delete $(id).dataset.k; $(id).removeAttribute('contenteditable'); } }
    $('who').innerHTML = `<span>경력</span>${T('owner.years', 'b')}<span>이메일</span>${T('owner.email', 'b')}<span>작성일</span>${T('owner.updated', 'b')}`;
    if (D.owner.stats?.length) $('coverTop').insertAdjacentHTML('beforeend', `<dl class="top-stats">${D.owner.stats.map(st => `<div class="ts${st.note ? ' has-note' : ''}"${st.note ? ` title="${esc(st.note)}" tabindex="0"` : ''}><dt>${esc(st.value)}</dt><dd>${esc(st.label)}${st.note ? `<small class="ts-note">${esc(st.note)}</small>` : ''}</dd></div>`).join('')}</dl>`);
    $('reel').innerHTML = (Array.isArray(D.owner.reels) && D.owner.reels.length) ? REELS('owner.reels') : REEL('owner.reel');
    $('guideHead').innerHTML = `${T('copy.projectsTitle', 'h2')}<span class="cnt">${D.projects.length}</span>`;
    $('guideConf').innerHTML = D.copy.confidential ? `<b>작성 원칙</b>${T('copy.confidential')}` : '';
    $('guideConf').hidden = !D.copy.confidential;
    $('toc').innerHTML = D.projects.map((p, i) => `<a href="#p${i + 1}"><span class="no">${pad(i + 1)}</span><span class="t"${CB.editing ? ` data-s="projects.${i}.title"` : ''}>${f(p.title)}</span><span class="o"${CB.editing ? ` data-s="projects.${i}.oneLine"` : ''}>${f(p.oneLine)}</span></a>`).join('');
    $('projects').innerHTML = D.projects.map((p, i) => {
      const P = `projects.${i}`;
      return `<article class="proj" id="p${i + 1}">
        <div class="wrap"><div class="opener">
          <div class="hd"><div class="big">${pad(i + 1)}</div><div><div class="kick">프로젝트 ${pad(i + 1)} ${ED(`<button data-move="projects|${i}|-1">위로</button><button data-move="projects|${i}|1">아래로</button><button data-del="projects|${i}">프로젝트 삭제</button>`)}</div>${T(P + '.title', 'h2')}</div></div>
          ${T(P + '.oneLine', 'p', 'ol')}
          <div class="meta">
            <div><span class="lbl">기간</span>${T(P + '.meta.period')}</div>
            <div><span class="lbl">팀 구성</span>${T(P + '.meta.team')}</div>
            <div><span class="lbl">맡은 역할</span>${T(P + '.meta.role')}</div>
            <div><span class="lbl">맡은 범위</span>${T(P + '.meta.contribution')}</div>
            <div><span class="lbl">사용 기술</span><span class="stack">${p.meta.stack.map((s, j) => !CB.editing && !String(s ?? '').trim() ? '' : T(`${P}.meta.stack.${j}`)).join('')}${ED(`<button data-add="${P}.meta.stack">+</button>`)}</span></div>
          </div>
          ${LKS(P + '.links')}
          ${(p.confidential || D.copy.confidential) ? `<p class="conf"><b>작성 원칙</b>${p.confidential ? `<span>${esc(p.confidential)}</span>` : T('copy.confidential')}</p>` : ''}
          ${p.summary ? `<div class="proj-summary"><div class="ps-col"><span class="ps-label">문제</span><p class="ps-text">${esc(p.summary.problem)}</p></div><div class="ps-arr" aria-hidden="true">→</div><div class="ps-col"><span class="ps-label">핵심 판단</span><p class="ps-text">${esc(p.summary.decision)}</p></div><div class="ps-arr" aria-hidden="true">→</div><div class="ps-col ps-result"><span class="ps-label">결과</span><p class="ps-text">${esc(p.summary.result)}</p></div></div>` : ''}
        </div></div>
        ${M(P + '.cover', `${pad(i + 1)}.0`, { hint: '대표 영상 또는 사진', bleed: true })}
        <div class="wrap"><div class="pbody">
        <nav class="ptoc" aria-label="이 프로젝트 목차">
          <div class="pt-hd"><span class="pt-no">${pad(i + 1)}</span><span class="pt-cnt"><b>1</b> / ${KEYS.length}</span></div>
          <div class="pt-bar"><i style="width:${100 / KEYS.length}%"></i></div>
          <ol>${KEYS.map((key, k) => `<li><button type="button" data-sec="${k}"${k === 0 ? ' class="on"' : ''}><span class="n">${pad(i + 1)}.${k + 1}</span><span class="t">${esc(plain(p.sectionTitles?.[k] || D.copy.sections[k].title))}</span></button></li>`).join('')}</ol>
        </nav>
        <div class="psecs">
        ${KEYS.map((key, k) => `<section class="sec" data-k-sec="${k}"><header><div class="n">${pad(i + 1)}.${k + 1}</div>${(p.sectionTitles?.[k] ? `<h3>${esc(plain(p.sectionTitles[k]))}</h3>` : T(`copy.sections.${k}.title`, 'h3'))}${T(`copy.sections.${k}.desc`, 'p')}</header><div class="body">${secBody(key, p, i)}</div></section>`).join('')}
        ${pager(i)}
        </div></div>
        </div></article>`;
    }).join('') + `<div class="wrap">${addBtn('projects', '프로젝트')}</div>`;

    if (D.others?.length) {
      $('others').hidden = false;
      // 진행 상황은 진행 중·완료·계획 셋 중 하나. 편집 모드에선 눌러서 고름
      const stNorm = s => /완료/.test(s || '') ? '완료' : /계획|예정/.test(s || '') ? '계획' : '진행 중';
      const stCls = s => ({ '완료': 'done', '계획': 'plan', '진행 중': 'on' })[stNorm(s)];
      const stPick = (q, s) => `<span class="ed-only stseg" role="group" aria-label="진행 상황">${['진행 중', '완료', '계획'].map(v => `<button type="button" data-set-st="${q}|${v}" class="${stCls(v)}${stNorm(s) === v ? ' sel' : ''}" aria-pressed="${stNorm(s) === v}">${v}</button>`).join('')}</span>`;
      $('othersWrap').innerHTML = `<nav class="appx-nav" id="othersNav" aria-label="\uc9c4\ud589 \uc911\uc778 \ud504\ub85c\uc81d\ud2b8 \ubaa9\ucc28"><div class="an-hd"><span class="an-no">\uc9c4\ud589\uc911</span><span class="an-cnt"><b>${D.others.length}</b>\uac1c</span></div><div class="an-bar"><i style="width:${100/D.others.length}%"></i></div><ol class="an-list">${D.others.map((g, gi) => `<li><button type="button" class="an-item" data-scroll="og${gi}"><span class="n">${String(gi+1).padStart(2,'0')}</span>${esc(plain(g.group))}</button></li>`).join('')}</ol></nav><div class="ah">${T('copy.othersTitle', 'h2')}</div>
        ${D.others.map((g, gi) => `<div class="pgrp" id="og${gi}"><h3>${T(`others.${gi}.group`)}<span class="c">${g.items.length}</span>${ED(`<button data-del="others|${gi}">묶음 삭제</button>`)}</h3>
          ${g.items.map((o, i) => { const q = `others.${gi}.items.${i}`; return `<div class="prow">
            <div class="meta2">${CB.editing ? stPick(q, o.status) : `<span class="st ${stCls(o.status)}">${esc(stNorm(o.status))}</span>`}${T(q + '.period')}</div>
            <div>${T(q + '.title', 'div', 'pt')}${T(q + '.oneLine', 'p')}${!CB.editing && amHas(o) ? `<div class="amtgw"><button type="button" class="amtg" data-am="o-${gi}-${i}" aria-expanded="false">${amLabel(o)}</button></div>` : ''}</div>
            <div class="tg">${(o.tags || []).map((t, j) => T(`${q}.tags.${j}`)).join('')}${okURL(o.link) ? `<a href="${esc(o.link)}" target="_blank" rel="noopener noreferrer">보기</a>` : ''}${LKS(q + '.links', 'sm')}${ED(`<button data-add="${q}.media">+ 사진·영상</button><button data-add="${q}.tags">+ 태그</button><button data-del="others.${gi}.items|${i}">삭제</button>`)}</div>
          </div>${amHas(o) ? (AM[`o-${gi}-${i}`] = o.media.map((m, j) => !CB.editing && !safeMedia(m.src) ? '' : `<div class="amf">${M(`${q}.media.${j}`, `${j + 1}`, { ratio: '16/9', hint: '사진 또는 영상' })}${delBtn(`${q}.media`, j)}</div>`).join(''), `<div class="pmed" data-am-row="o-${gi}-${i}"${CB.editing ? '' : ' hidden'}><div class="amed">${CB.editing ? AM[`o-${gi}-${i}`] : ''}</div></div>`) : ''}`; }).join('')}
          ${addBtn(`others.${gi}.items`, '프로젝트')}</div>`).join('')}
        ${addBtn('others', '묶음')}`;
    } else $('others').hidden = true;
    if (D.activities?.length) {
      $('activities').hidden = false;
      $('actsWrap').innerHTML = `<nav class="appx-nav" id="actsNav" aria-label="\ub300\uc678 \uc774\ub825 \ubaa9\ucc28"><div class="an-hd"><span class="an-no">\ub300\uc678</span><span class="an-cnt"><b>${D.activities.length}</b>\uac1c</span></div><div class="an-bar"><i style="width:${100/D.activities.length}%"></i></div><ol class="an-list">${D.activities.map((g, gi) => `<li><button type="button" class="an-item" data-scroll="ag${gi}"><span class="n">${String(gi+1).padStart(2,'0')}</span>${esc(plain(g.group))}</button></li>`).join('')}</ol></nav><div class="ah">${T('copy.actsTitle', 'h2')}</div>
        <table class="acts">${D.activities.map((g, gi) => g.items.map((it, k) => `<tr class="${k === 0 ? 'first' : ''}" ${k === 0 ? `id="ag${gi}"` : ''}>
          ${k === 0 ? `<th data-amg="${gi}" rowspan="${g.items.reduce((n, x) => n + 1 + (CB.editing && amHas(x) ? 1 : 0), 0)}">${T(`activities.${gi}.group`)}${ED(`<button data-add="activities.${gi}.items">+ 항목</button><button data-del="activities|${gi}">묶음 삭제</button>`)}</th>` : ''}
          <td class="w">${T(`activities.${gi}.items.${k}.when`)}</td><td class="t">${T(`activities.${gi}.items.${k}.what`)}</td><td class="o">${T(`activities.${gi}.items.${k}.org`)}</td><td class="nt">${T(`activities.${gi}.items.${k}.note`)}${LKS(`activities.${gi}.items.${k}.links`, 'sm act-lks')}${!CB.editing && amHas(it) ? `<div class="amtgw"><button type="button" class="amtg" data-am="${gi}-${k}" aria-expanded="false">${amLabel(it)}</button></div>` : ''}${ED(`<button data-add="activities.${gi}.items.${k}.media">+ 사진·영상</button>`)}${delBtn(`activities.${gi}.items`, k)}</td></tr>${amHas(it) ? (AM[`${gi}-${k}`] = it.media.map((m, j) => !CB.editing && !safeMedia(m.src) ? '' : `<div class="amf">${M(`activities.${gi}.items.${k}.media.${j}`, `${j + 1}`, { ratio: '16/9', hint: '사진 또는 영상' })}${delBtn(`activities.${gi}.items.${k}.media`, j)}</div>`).join(''), `<tr class="amrow" data-am-row="${gi}-${k}"${CB.editing ? '' : ' hidden'}><td colspan="4"><div class="amed">${CB.editing ? AM[`${gi}-${k}`] : ''}</div></td></tr>`) : ''}`).join('')).join('')}</table>${addBtn('activities', '묶음')}`;
    } else $('activities').hidden = true;

    if (D.side && (D.side.show || CB.editing)) {
      const S = D.side, n = S.items.length;
      $('side').hidden = false; $('side').classList.toggle('off', !S.show);
      $('sideWrap').innerHTML = `<nav class="appx-nav" id="sideNav" aria-label="\uad00\uc2ec\uc0ac \ubaa9\ucc28"><div class="an-hd"><span class="an-no">\uad00\uc2ec\uc0ac</span><span class="an-cnt"><b>${n}</b>\uac1c</span></div><div class="an-bar"><i style="width:${100/n}%"></i></div><ol class="an-list">${S.items.map((it, i) => `<li><button type="button" class="an-item" data-scroll="si${i}"><span class="n">${String(i+1).padStart(2,'0')}</span>${esc(plain(it.title))}</button></li>`).join('')}</ol></nav><div class="ah">${T('copy.sideTitle', 'h2')}${ED(`<button data-side-toggle>${S.show ? '이 칸 숨기기' : '숨김 상태 · 다시 보이기'}</button>`)}</div>
        <div class="icards" style="--cols:${n <= 3 ? Math.max(n, 2) : n === 4 ? 2 : 3}">${S.items.map((it, i) => { const q = `side.items.${i}`; return `<article class="icard" id="si${i}">${ED(`<button data-del="side.items|${i}">삭제</button>`)}
          <span class="no">${pad(i + 1)}</span>${T(q + '.title', 'h3')}${T(q + '.desc', 'p')}
          <div class="acts2"><b>참여한 활동</b><ul>${(it.acts || []).map((a, j) => `<li>${T(`${q}.acts.${j}`)}${ED(`<button data-del="${q}.acts|${j}">빼기</button>`)}</li>`).join('')}</ul>${ED(`<button data-add="${q}.acts">+ 활동</button>`)}</div>
        </article>`; }).join('')}</div>
        ${addBtn('side.items', '관심사')}`;
    } else $('side').hidden = true;

    const mailOK = /^[^\s@\[]+@[^\s@]+\.[^\s@]+$/.test(D.owner.email || '');
    $('endWrap').innerHTML = `<div class="ft">© ${new Date().getFullYear()} ${f(D.owner.name)}</div>${!CB.editing && mailOK ? `<a class="mail" href="mailto:${esc(D.owner.email)}">${esc(D.owner.email)}</a>` : T('owner.email', 'span', 'mail')}${LKS('owner.links', 'sm end-lks')}`;

    
    // 왼쪽 네비 스크롤 처리 + 현재 섹션 하이라이트
    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-scroll]');
      if (!btn) return;
      e.preventDefault();
      const el = document.getElementById(btn.dataset.scroll);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        btn.closest('.appx-nav').querySelectorAll('.an-item').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
      }
    });
    // 스크롤 시 하이라이트 갱신
    let anTick = 0;
    window.addEventListener('scroll', () => {
      clearTimeout(anTick);
      anTick = setTimeout(() => {
        document.querySelectorAll('.appx-nav').forEach(nav => {
          if (nav.offsetParent === null) return;
          const items = [...nav.querySelectorAll('.an-item')];
          let active = items[0];
          for (const item of items) {
            const el = document.getElementById(item.dataset.scroll);
            if (el && el.getBoundingClientRect().top <= 200) active = item;
          }
          items.forEach(b => b.classList.toggle('on', b === active));
          const bar = nav.querySelector('.an-bar i');
          if (bar) { const idx = items.indexOf(active); bar.style.width = ((idx + 1) / items.length * 100) + '%'; }
        });
      }, 80);
    }, { passive: true });
    setupVideos();
    addEventListener('beforeprint',()=>document.querySelectorAll('details.sec-fold').forEach(d=>d.open=true));
    fitReel();
    route(false);
    CB.afterRender && CB.afterRender();
  };

  /* 영상: 화면에 보이면 재생, 벗어나면 멈춤. 움직임 줄이기 설정이면 자동 재생 안 함. */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let io;
  function fmt(s) { s = Math.round(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
  function setupVideos() {
    io && io.disconnect();
    io = new IntersectionObserver(es => es.forEach(e => {
      const v = e.target; if (v.dataset.user === 'paused' || reduce) return;
      if (e.isIntersecting) v.play().catch(() => {}); else v.pause();
    }), { threshold: 0.35 });
    document.querySelectorAll('.media video').forEach(v => {
      io.observe(v);
      const box = v.closest('.fig'), cd = box && box.querySelector('.cd'), pb = v.parentElement.querySelector('[data-v="play"]');
      v.addEventListener('loadedmetadata', () => { if (cd) cd.textContent = fmt(v.duration); });
      v.addEventListener('play', () => pb && (pb.textContent = '일시정지'));
      v.addEventListener('pause', () => pb && (pb.textContent = '재생'));
      if (reduce && pb) pb.textContent = '재생';
    });
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('.vc button'); if (!b) return;
    const v = b.closest('.media').querySelector('video');
    if (b.dataset.v === 'play') { if (v.paused) { v.dataset.user = ''; v.play(); } else { v.dataset.user = 'paused'; v.pause(); } }
    else { v.muted = !v.muted; b.textContent = v.muted ? '소리 켜기' : '소리 끄기'; }
  });

  /* 사진을 누르면 화면 가득 원본으로. 한 번 더 누르면 실제 크기, Esc·바깥·닫기로 닫힘 */
  let lb = null, lbBack = null;
  function openLB(img) {
    closeLB(); lbBack = document.activeElement;
    lb = document.createElement('div'); lb.className = 'lbx'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.setAttribute('aria-label', '사진 크게 보기');
    const cap = img.closest('.fig')?.querySelector('.ct')?.innerText.trim() || '';
    lb.innerHTML = '<button type="button" class="lbx-x" aria-label="닫기">닫기</button><div class="lbx-sc"><img alt=""></div><p class="lbx-cap"></p><p class="lbx-tip">사진을 누르면 실제 크기로 볼 수 있어요</p>';
    const big = lb.querySelector('img'); big.src = img.currentSrc || img.src; big.alt = img.alt || cap;
    lb.querySelector('.lbx-cap').textContent = cap;
    document.body.appendChild(lb); document.documentElement.style.overflow = 'hidden';
    lb.querySelector('.lbx-x').focus();
  }
  function closeLB() { if (!lb) return; lb.remove(); lb = null; document.documentElement.style.overflow = ''; if (lbBack && lbBack.focus) lbBack.focus(); }
  document.addEventListener('click', e => {
    if (lb) {
      if (e.target.closest('.lbx-x') || e.target === lb || e.target.classList.contains('lbx-sc') || e.target.classList.contains('lbx-cap') || e.target.classList.contains('lbx-tip')) { closeLB(); return; }
      if (e.target.closest('.lbx img')) { lb.classList.toggle('full'); return; }
      return;
    }
    if (CB.editing) return;
    const img = e.target.closest('.media > img'); if (!img) return;
    e.preventDefault(); openLB(img);
  });
  addEventListener('keydown', e => { if (lb && e.key === 'Escape') { e.preventDefault(); closeLB(); } });

  /* 읽는 위치 표시 */
  function onScroll() {
    const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
    $('prog').style.width = (h > 0 ? y / h * 100 : 0) + '%';
    syncToc();
  }
  /* 프로젝트 목차: 지금 보는 섹션 표시 */
  function tocOffset(art) { const t = art.querySelector('.ptoc'); return (document.querySelector('.bar')?.offsetHeight || 56) + (t && getComputedStyle(t).position === 'sticky' && t.offsetWidth > t.offsetHeight * 3 ? t.offsetHeight : 0) + 24; }
  /* 모바일 햄버거 메뉴: 페이지 이동 + 지금 프로젝트의 섹션 목차 */
  function buildMenu(r) {
    const m = $('mnav'); if (!m) return;
    const D = CB.D, pages = [...$('barNav').querySelectorAll('a')].map(a => `<a href="${a.getAttribute('href')}"${a.dataset.p === r ? ' class="on" aria-current="page"' : ''}>${a.innerHTML}</a>`).join('');
    const i = /^p\d+$/.test(r) ? +r.slice(1) - 1 : -1;
    const toc = i >= 0 ? `<h4>이 프로젝트 목차</h4><div class="mtoc">${D.copy.sections.map((sx, k) => `<button type="button" data-sec="${k}"><span class="n">${pad(i + 1)}.${k + 1}</span>${esc(plain((D.projects[i]?.sectionTitles?.[k]) || sx.title))}</button>`).join('')}</div>` : '';
    m.innerHTML = `<a href="#home"${r === 'home' ? ' class="on" aria-current="page"' : ''}>처음으로</a>${pages}${toc}`;
  }
  function setMenu(open) {
    const m = $('mnav'), b = $('mbtn'), sh = $('mshade'); if (!m || !b) return;
    m.hidden = sh.hidden = !open; b.setAttribute('aria-expanded', open ? 'true' : 'false'); b.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
    document.documentElement.style.overflow = open ? 'hidden' : '';
    if (open) syncToc();
  }
  document.addEventListener('click', e => {
    if (e.target.closest('#mbtn')) { setMenu($('mnav').hidden); return; }
    if (e.target.closest('#mshade') || e.target.closest('#mnav a')) setMenu(false);
  });
  addEventListener('keydown', e => { if (e.key === 'Escape' && $('mnav') && !$('mnav').hidden) { setMenu(false); $('mbtn').focus(); } });
  addEventListener('resize', () => { if (innerWidth > 900 && $('mnav') && !$('mnav').hidden) setMenu(false); });
  function syncToc() {
    const art = document.querySelector('#projects > .proj.cur'); if (!art) return;
    const secs = [...art.querySelectorAll('.psecs > .sec')], off = tocOffset(art);
    const line = off + (innerHeight - off) * 0.33;
    let cur = 0; secs.forEach((s, k) => { const hd = s.querySelector('header') || s; if (hd.getBoundingClientRect().top <= line) cur = k; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4 && secs.length) { const last = secs[secs.length - 1]; if (last.getBoundingClientRect().top < innerHeight) cur = secs.length - 1; }
    art.querySelectorAll('.ptoc [data-sec]').forEach((b, k) => b.classList.toggle('on', k === cur));
    document.querySelectorAll('#mnav [data-sec]').forEach((b, k) => b.classList.toggle('on', k === cur));
    const c = art.querySelector('.pt-cnt b'); if (c) c.textContent = cur + 1;
    const bar = art.querySelector('.pt-bar i'); if (bar) bar.style.width = ((cur + 1) / secs.length * 100) + '%';
    const ol = art.querySelector('.ptoc ol'), on = art.querySelector('.ptoc [data-sec].on');
    if (ol && on && ol.scrollWidth > ol.clientWidth + 2) ol.scrollLeft = on.offsetLeft - ol.offsetLeft - (ol.clientWidth - on.offsetWidth) / 2;
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('.ptoc [data-sec], #mnav [data-sec]'); if (!b) return;
    if (b.closest('#mnav')) setMenu(false);
    const art = b.closest('.proj') || document.querySelector('#projects > .proj.cur'); if (!art) return;
    const sec = art.querySelectorAll('.psecs > .sec')[+b.dataset.sec]; if (!sec) return;
    e.preventDefault();
    window.scrollTo({ top: sec.getBoundingClientRect().top + scrollY - tocOffset(art) + 8, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
  /* 페이지 전환: #home(표지·목록), #p1·#p2…(프로젝트 하나씩), #others·#activities·#side
     경력기술서에서 [주소]#p1 로 연결하면 그 프로젝트 페이지가 바로 열립니다. */
  function route(toTop) {
    const h = location.hash.slice(1), D = CB.D;
    let r = 'home';
    if (/^p\d+$/.test(h) && +h.slice(1) >= 1 && +h.slice(1) <= D.projects.length) r = h;
    else if (['others', 'activities', 'side'].includes(h) && !$(h).hidden) r = h;
    document.body.dataset.route = r;
    document.querySelectorAll('#projects > .proj').forEach(a => a.classList.toggle('cur', a.id === r));
    document.querySelectorAll('#barNav a').forEach(a => a.classList.toggle('on', a.dataset.p === r));
    const nav = $('barNav'), on = nav.querySelector('a.on');
    nav.scrollLeft = on ? on.offsetLeft - nav.offsetLeft - (nav.clientWidth - on.offsetWidth) / 2 : 0;
    const base = isSlot(D.owner.name) ? '포트폴리오' : plain(D.owner.name);
    const i = r[0] === 'p' && r !== 'home' ? +r.slice(1) - 1 : -1;
    document.title = i >= 0 ? `${pad(i + 1)} ${isSlot(D.projects[i].title) ? '프로젝트 ' + (i + 1) : plain(D.projects[i].title)} · ${base}` : base;
    buildMenu(r); setMenu(false);
    if (toTop) window.scrollTo({ top: 0, behavior: 'instant' });
    onScroll();
  }
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('hashchange', () => route(true));
  CB.render();
})();
</script>

<script id="casebook-editor">
/* 편집 모드. '배포용 내보내기'로 만든 파일에서는 이 블록이 통째로 빠집니다.
   원본 파일을 실수로 올려도 내 컴퓨터(파일 직접 열기, localhost)에서만 켜집니다. */
(function () {
  const LOCAL = location.protocol === 'file:' || ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);

  const DRAFT = 'casebook-draft:' + location.pathname;

  .edbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .edfab{position:fixed;right:16px;bottom:16px;z-index:100;background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;box-shadow:0 10px 26px -10px rgba(0,0,0,.5)}
  .edfab:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .edbar[hidden],.edfab[hidden]{display:none}
  .end{padding-bottom:84px}
  .edtoast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:101;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 26px -12px rgba(0,0,0,.25);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
  .edtoast.on{opacity:1}

  .edmodal .ck small{font-weight:400;color:#625d56;font-size:13px}
  .edmodal input[type=password],.edmodal input[type=text]{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid #d9d4cc;border-radius:8px;margin-bottom:8px}
  .edmodal .lnk{background:none;border:0;color:#a24800;font-weight:600;font-size:13.5px;padding:2px 0}
  .edmodal .hint{font-size:12.5px;color:#625d56;margin-top:8px;line-height:1.55}
  .edmodal .err{color:#b42318;font-size:13.5px;min-height:1.3em;margin-top:6px}
  .edmodal .act{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
  .edmodal .act button{font-weight:700;border:1px solid #d9d4cc;background:#fff;border-radius:8px;padding:8px 16px}
  .edmodal .act .pri{background:#1b1916;color:#fff;border-color:#1b1916}
  .eddraft button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;font-size:13px;font-weight:600}
  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media print{.ed-ui{display:none!important}}`;
  document.head.appendChild(css);

  const fab = Object.assign(document.createElement('button'), { className: 'edfab ed-ui', textContent: '편집하기' });
  const bar = document.createElement('div'); bar.className = 'edbar ed-ui'; bar.hidden = true;
  bar.innerHTML = `<button class="hlb" data-b="hl" title="글자를 드래그한 뒤 누르세요 (Cmd+B)">강조</button><button data-b="lk" title="글자를 드래그한 뒤 누르세요 (Cmd+K)">링크</button><span class="sep"></span>
    <select data-b="theme" title="색"><option value="orange">오렌지</option><option value="navy-orange">네이비 + 주황</option><option value="navy">네이비</option></select>
    <select data-b="slot" title="빈칸 표시 색"><option value="orange">빈칸: 주황</option><option value="navy">빈칸: 네이비</option></select>
    <button data-b="dir">폴더 연결</button><span class="sep"></span><span class="st">저장됨</span>
    <button data-b="save">저장</button><button data-b="export">배포용 내보내기</button><button class="pri" data-b="done">편집 끝내기</button>`;
  const toastEl = Object.assign(document.createElement('div'), { className: 'edtoast ed-ui' });
  document.body.append(fab, bar, toastEl);
  const toast = (m, ms = 2600) => { toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(toastEl._t); toastEl._t = setTimeout(() => toastEl.classList.remove('on'), ms); };
  const st = bar.querySelector('.st');
  const isDirty = () => JSON.stringify(CB.D) !== saved;
  let autoT = null;
  function mark() {
    const d = isDirty(); st.textContent = d ? '저장 안 됨' : '저장됨'; st.classList.toggle('dirty', d);
    if (d) localStorage.setItem(DRAFT, JSON.stringify(CB.D));

  /* 연결한 폴더를 브라우저에 기억해 두고 다음에 다시 씀 (내 컴퓨터 안에서만) */
  const IDB = {

  async function useDir(h, ask) {

  async function cleanMedia(file) {

    const u = new Uint8Array(await file.arrayBuffer());
    if (u[0] === 0xFF && u[1] === 0xD8) {

  function localMedia() {

  /* ---------- 배포용 내보내기 (비밀번호 선택) ----------
     비밀번호를 걸면 본문과 영상·사진을 모두 AES-GCM으로 암호화합니다.

  async function exportSingle(opt) {

      out = (await harden(gateHTML({ v: 1, id: hex(6), salt: b64(salt), iter: ITER, iv: body.iv, ct: b64(body.ct) }), inner.hashes)).html;
    }
    const nm = CB.isSlot(CB.D.owner.name) ? '' : CB.plain(CB.D.owner.name).replace(/[\\/:*?"<>|]+/g, '').trim();
    const fname = (nm ? nm + '_' : '') + '포트폴리오.html';
    const mb = new Blob([out]).size / 1048576;
    if (dir) { const o = await dir.getDirectoryHandle('보내기용', { create: true }); await writeAt(fname, out, o); }
    else download(fname, out);
    toast(`${dir ? '보내기용 폴더에 ' : ''}${fname}을 만들었어요 (${mb.toFixed(1)}MB).${opt.pw ? ' 비밀번호를 걸었어요.' : ''}`, 6000);
    if (mb > 24) await uiAlert(`파일이 ${mb.toFixed(0)}MB예요. 메일 첨부 한도(보통 25MB)를 넘을 수 있어요. 영상을 짧게 줄이거나 클라우드 링크로 보내세요.`);
    if (miss.length) await uiAlert('찾지 못한 파일이 있어요:\n' + miss.join('\n'));
  }

  async function exportSite() {
    const n = (JSON.stringify(CB.D).match(/\[\[.+?\]\]/g) || []).length;
    if (n && !(await uiConfirm(`아직 빈칸이 ${n}개 있어요. 배포본에도 노란 칸으로 보입니다. 그래도 만들까요?`))) return;
    const opt = await askExport(); if (!opt) return;
    if (opt.mode === 'single') return exportSingle(opt);
    const raw = buildHTML(true), files = localMedia();
    const inner = await harden(raw), html = inner.html;
    if (!dir && !(await connectDir())) {
      if (opt.pw && files.length) return uiAlert('영상·사진을 암호화하려면 폴더 연결이 필요해요.');
      if (!opt.pw) { download('index.html', html); if (files.length) await uiAlert('영상·사진 파일은 따로 함께 올려야 해요:\n' + files.join('\n')); return; }
    }
    toast(opt.pw ? '암호화하는 중... 영상이 크면 조금 걸려요.' : '배포용 폴더를 만드는 중...', 20000);
    // 예전 배포본이 남아 암호화 안 된 파일이 섞이지 않도록 폴더를 비우고 다시 만듦
    if (dir) { try { await dir.removeEntry('배포용', { recursive: true }); } catch {} }
    const out = dir ? await dir.getDirectoryHandle('배포용', { create: true }) : null;
    let miss = [];
    if (!opt.pw) {
      await writeAt('index.html', html, out);
      for (const f of files) { try { await writeAt(f, await readAt(f), out); } catch { miss.push(f); } }
      await writeAt('robots.txt', 'User-agent: *\nDisallow: /\n', out);
      toast(`배포용 폴더를 만들었어요. 비밀번호 없이 누구나 볼 수 있는 판이에요.`, 5000);
    } else {
      const salt = rand(16), key = await deriveKey(opt.pw, salt), media = [];
      for (const f of files) {
        try {
          const file = await readAt(f), ext = (f.split('.').pop() || '').toLowerCase();
          const s = await seal(key, await file.arrayBuffer()), name = `m/${hex(12)}.bin`;
          await writeAt(name, s.ct, out);
          media.push({ path: f, file: name, iv: s.iv, type: MIME[ext] || file.type || 'application/octet-stream' });
        } catch { miss.push(f); }
      }
      const body = await seal(key, enc.encode(JSON.stringify({ html, media })));
      const payload = { v: 1, id: hex(6), salt: b64(salt), iter: ITER, iv: body.iv, ct: b64(body.ct) };
      const gate = (await harden(gateHTML(payload), inner.hashes, "'self'")).html;
      if (out) {
        await writeAt('index.html', gate, out);
        await writeAt('robots.txt', 'User-agent: *\nDisallow: /\n', out);
        await writeAt('.nojekyll', '', out);
      } else download('index.html', gate);
      toast(`비밀번호를 건 배포본을 만들었어요. 영상·사진 ${media.length}개도 암호화했어요.`, 6000);
    }
    if (miss.length) await uiAlert('찾지 못한 파일이 있어요:\n' + miss.join('\n'));
  }

  bar.addEventListener('mousedown', e => { if (e.target.closest('[data-b="hl"], [data-b="lk"]')) e.preventDefault(); });
  bar.addEventListener('click', async e => {
    const b = e.target.closest('[data-b]'); if (!b) return;
    const k = b.dataset.b;
    if (k === 'hl') toggleHL();
    if (k === 'lk') toggleLink();
    if (k === 'dir') connectDir();
    if (k === 'save') save();
    if (k === 'export') exportSite();
    if (k === 'done') {
      if (isDirty() && !(await save(false)) && !(await uiConfirm('파일에 저장하지 못했어요. 수정 내용은 브라우저에 임시로 남아 있어요. 그래도 끝낼까요?'))) return;
      setEditing(false);
    }
  });
  bar.querySelector('[data-b="theme"]').addEventListener('change', e => { CB.D.theme = e.target.value; mark(); rerender(); });
  bar.querySelector('[data-b="slot"]').addEventListener('change', e => { CB.D.slotColor = e.target.value; mark(); rerender(); });
  addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

  /* 저장 안 한 수정이 남아 있으면 묻지 않고 바로 불러와 이어서 편집 (새로고침해도 되돌아가지 않게) */
  const draft = localStorage.getItem(DRAFT);
  if (draft && draft !== original) {
    let d = null; try { d = JSON.parse(draft); } catch {}
    const ok = d && typeof d === 'object' && !Array.isArray(d) && d.owner && typeof d.owner === 'object' && Array.isArray(d.projects) && d.copy && typeof d.copy === 'object';
    if (!ok) { localStorage.removeItem(DRAFT); uiAlert('임시 저장본이 손상돼서 불러오지 않았어요.'); }
    else {
      CB.D = d; window.CASEBOOK = CB.D; setEditing(true); mark();
      const box = document.createElement('div'); box.className = 'eddraft ed-ui';
      box.innerHTML = '저장 안 된 수정을 불러왔어요. <button data-x="save">파일에 저장</button><button data-x="drop">버리기</button>';
      document.body.appendChild(box);
      box.onclick = async e => {
        const x = e.target.dataset.x; if (!x) return;
        if (x === 'save') { if (await save(false)) box.remove(); }
        else if (await uiConfirm('불러온 수정 내용을 버리고 파일에 저장된 내용으로 돌아갈까요?')) {
          clearTimeout(autoT); localStorage.removeItem(DRAFT); CB.D = JSON.parse(original); window.CASEBOOK = CB.D; saved = original; mark(); rerender(); box.remove();
        }
      };
    }
  }
  // 예전에 연결한 폴더가 이미 허용돼 있으면 조용히 이어 쓰고, 저장 안 된 게 있으면 바로 저장
  ensureDir(false).then(ok => { if (ok && isDirty()) save(true); });
})();
</script>
