<script>(function gateMain() {
    // 다른 사이트가 프레임으로 감싸면(클릭재킹) 비밀번호 칸을 보여 주지 않음
    try { if (window.top !== window.self && window.top.location.origin !== window.location.origin) throw 0; }
    catch (e) { document.documentElement.innerHTML = ''; return; }
    var P = JSON.parse(document.getElementById('payload').textContent);
    var ub = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
    var form = document.getElementById('f'), inp = document.getElementById('pw'), msg = document.getElementById('msg'), btn = document.getElementById('go');
    // 열쇠는 비밀번호에서 매번 새로 만들고, 어디에도 저장하지 않음(내보낼 수 없는 열쇠)
    async function keyFrom(pw) {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }
    async function open(key, first) {
      var data = JSON.parse(new TextDecoder().decode(first));
      var map = {};
      for (var i = 0; i < data.media.length; i++) {
        var m = data.media[i];
        msg.textContent = '여는 중... 영상·사진 ' + (i + 1) + ' / ' + data.media.length;
        try {
          var src;
          if (m.d) src = ub(m.d);
          else {
            if (!/^m\/[0-9a-f]{24}\.bin$/.test(m.file)) continue;
            var r = await fetch(m.file, { credentials: 'omit', cache: 'no-store' }); if (!r.ok) continue; src = await r.arrayBuffer();
          }
          var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(m.iv) }, key, src);
          map[m.path] = URL.createObjectURL(new Blob([pt], { type: m.type }));
        } catch (e) {}
      }
      inp.value = ''; key = null;
      window.__CB_MEDIA = map;
      document.open(); document.write(data.html); document.close();
    }
    form.addEventListener('submit', async function (e) {
      e.preventDefault(); if (!inp.value) return;
      btn.disabled = true; msg.className = 'm'; msg.textContent = '확인 중...';
      var key, first;
      try { key = await keyFrom(inp.value); first = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(P.iv) }, key, ub(P.ct)); }
      catch (err) { msg.className = 'm bad'; msg.textContent = '비밀번호가 맞지 않아요.'; btn.disabled = false; inp.select(); return; }
      open(key, first);
    });
    inp.focus();
  })();</script>
